<!DOCTYPE html>
<html>
<head>
  <title>Support Me</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #111827, #1e293b, #7c2d12);
      margin: 0;
      color: white;
      text-align: center;
    }

    .navbar {
      padding: 20px 40px;
      text-align: left;
    }

    .navbar a {
      color: white;
      text-decoration: underline;
      font-size: 18px;
    }

    .support-box {
      background: linear-gradient(135deg, #1e293b, #334155);
      padding: 50px;
      border-radius: 25px;
      max-width: 500px;
      margin: 80px auto;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
    }

    #amountText {
      font-size: 55px;
      color: #22c55e;
      margin: 20px 0;
    }

    .money-slider {
      width: 85%;
      margin: 30px 0;
      accent-color: #22c55e;
      cursor: pointer;
    }

    .cash-button {
      display: inline-block;
      background: #22c55e;
      color: white;
      text-decoration: none;
      padding: 16px 36px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      transition: 0.3s;
    }

    .cash-button:hover {
      background: #16a34a;
      transform: scale(1.05);
    }

    .small-note {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 18px;
    }

    .back-btn {
      margin-top: 30px;
      display: block;
      color: white;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="navbar">
    <a href="index.html">← Home</a>
  </div>

  <div class="support-box">
    <h1>Support Me</h1>

    <p>Choose how much you want to support:</p>

    <h2 id="amountText">$1</h2>

    <input
      type="range"
      min="1"
      max="100"
      value="1"
      class="money-slider"
      id="moneySlider"
    >

    <br>

    <a
      id="cashAppButton"
      class="cash-button"
      href="https://cash.app/$ezcashin"
      target="_blank"
    >
      Send $1 on Cash App →
    </a>

    <p class="small-note">
      This will open my Cash App page. Please enter the amount you picked above.
    </p>

    <a class="back-btn" href="index.html">← Back Home</a>
  </div>

  <script>
    const slider = document.getElementById("moneySlider");
    const amountText = document.getElementById("amountText");
    const cashAppButton = document.getElementById("cashAppButton");

    slider.addEventListener("input", function() {
      const amount = slider.value;
      amountText.textContent = "$" + amount;
      cashAppButton.textContent = "Send $" + amount + " on Cash App →";
    });
  </script>

</body>
</html>
